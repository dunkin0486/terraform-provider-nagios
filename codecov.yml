coverage:
  status:
    project:
      # internal/client is unit-tested in CI (httptest, no external
      # dependency) - a decrease here is a real regression, so it's a hard
      # gate. target: auto compares against the PR base's client coverage;
      # threshold absorbs float noise from line-count shifts (e.g. a new
      # file changing the covered/total ratio slightly) that aren't an
      # actual drop in test rigor.
      client:
        target: auto
        threshold: 0.5%
        paths:
          - internal/client/
      # internal/provider is primarily verified by TF_ACC=1 acceptance
      # tests (see CLAUDE.md), which never run in CI and so never count
      # toward this number - gating on it would either block legitimately
      # acceptance-tested PRs or incentivize low-value unit tests written
      # just to satisfy the gate. Stays informational until CI can run
      # acceptance tests.
      provider:
        informational: true
        paths:
          - internal/provider/
      default:
        informational: true
    patch:
      # target: auto, matching project.client above: new internal/client
      # lines just need to cover at least as well as the project's overall
      # client coverage did at the PR's base commit, not a fixed floor. A
      # fixed 80% here (the original setting) blocked PRs whose new lines
      # were legitimately covered but happened to land under 80%, even
      # when the PR left overall coverage unchanged or better - the intent
      # was always a ratchet against the pre-PR baseline, not a fixed bar.
      client:
        target: auto
        threshold: 0.5%
        paths:
          - internal/client/
      provider:
        informational: true
        paths:
          - internal/provider/
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"

flags:
  unit:
    paths:
      - internal/
    carryforward: false
