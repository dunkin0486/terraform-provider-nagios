version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # test/docker/nagiosxi/Dockerfile builds the local Nagios XI acceptance
  # test instance, not the provider itself - tracked separately since it's
  # a different base image (Rocky Linux) with its own update cadence.
  - package-ecosystem: "docker"
    directory: "/test/docker/nagiosxi"
    schedule:
      interval: "weekly"
