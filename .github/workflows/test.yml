name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  # lint/test are required status checks on main. A trigger-level paths
  # filter would make GitHub wait forever on PRs that never schedule these
  # jobs at all - instead this job always runs (cheap) and lint/test key off
  # its output with a job-level `if:`, which reports "skipped" rather than
  # never reporting - and GitHub treats a skipped required check as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.filter.outputs.provider }}
    steps:
      # dorny/paths-filter only uses the GitHub API (skipping the need for a
      # checkout) for pull_request events - for push (main's post-merge
      # commits, release-please's version-bump commits), it needs actual git
      # history to diff against github.event.before, and fails outright
      # without one ("fatal: not a git repository"). Confirmed this was
      # silently failing changes -> lint/test (via `if: needs.changes...`)
      # skipped, not run - on every push to main. fetch-depth: 0 for full
      # history rather than a fixed shallow depth, since a push can carry
      # more than one new commit (a merge commit, not just a single squash).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            provider:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'examples/**'
              - '.github/workflows/test.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'
          repo-checkout: false

  test:
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git diff against the PR base commit below needs real history -
          # the default shallow (fetch-depth: 1) checkout only has HEAD. A
          # conditional expression here (0 only for pull_request) hits
          # GitHub Actions' "falsy zero" ternary trap - `cond && 0 || 1`
          # always evaluates to 1, since 0 itself is falsy and `||` can't
          # tell "the middle operand deliberately produced 0" apart from
          # "the middle operand was never reached" - confirmed live (#205)
          # when it silently left every pull_request run shallow anyway,
          # breaking the exemption step's git diff below outright. Unlike
          # the `changes` job above, always fetch-depth: 0 unconditionally.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go build ./...
      - run: go test -v -coverprofile=coverage.out -covermode=atomic ./internal/...
      - run: terraform fmt -check -recursive examples/
      # A brand-new internal/client/**/*.go file starts every PR at a
      # coverage disadvantage vs. the codecov.yml ratchet below, which
      # compares against internal/client's mature, multi-PR-averaged
      # coverage - a new file with genuine (but first-draft) coverage can
      # fail codecov/patch/client and codecov/project/client for being new,
      # not for being undertested (#205, following #204's nna_source_group
      # and #213's nna_user both hitting this). Codecov's own config has no
      # "this file is new to this PR" concept to carve out, so this computes
      # it ourselves: any *.go file added (not modified) under internal/
      # client/ since the PR's base commit is held to a fixed floor instead
      # of the ratchet, then stripped from coverage.out before upload so
      # Codecov's own ratchet math never sees it. Once merged, the file
      # exists in the next PR's base commit and is no longer "new" - it's
      # ratcheted normally like every other existing file from then on, with
      # no follow-up cleanup step required. Skipped for push events (no PR
      # base to compare against); those only happen on already-merged main
      # commits anyway.
      - name: Exempt brand-new internal/client files from the coverage ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          MODPATH="$(awk '/^module /{print $2}' go.mod)"
          MIN_COVERAGE=50

          new_files="$(git diff --name-status "$BASE"...HEAD -- internal/client/ | awk -F'\t' '$1 == "A" && $2 ~ /\.go$/ && $2 !~ /_test\.go$/ {print $2}')"
          if [ -z "$new_files" ]; then
            echo "No new internal/client files in this diff."
            exit 0
          fi

          fail=0
          while IFS= read -r f; do
            target="$MODPATH/$f"
            pct=$(awk -v target="$target" '
              { split($1, a, ":")
                if (a[1] == target) { total += $2; if ($3 > 0) covered += $2 } }
              END { if (total == 0) print 0; else printf "%d", (covered/total)*100 }
            ' coverage.out)
            echo "$f is new this PR: ${pct}% covered (fixed floor for new files: ${MIN_COVERAGE}%)"
            if [ "$pct" -lt "$MIN_COVERAGE" ]; then
              echo "::error file=$f::New file $f is only ${pct}% covered, below the ${MIN_COVERAGE}% floor required even for a first PR."
              fail=1
              continue
            fi
            grep -vF "${target}:" coverage.out > coverage.out.tmp && mv coverage.out.tmp coverage.out
          done <<< "$new_files"

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # codecov/project/client and codecov/patch/client are required status
  # checks on main, but unlike lint/test above they aren't native GitHub
  # Actions check runs - they're posted by the Codecov app only after it
  # receives an upload from the `test` job. A skipped `test` job (no Go
  # changes) never uploads anything, so Codecov never reports either
  # context for this commit and the required check sits "Expected -
  # waiting for status" forever, blocking merge on every PR that doesn't
  # touch Go code (release-please PRs, docs-only PRs, etc). When there's
  # no internal/client diff to ratchet against, synthesize a passing
  # status for both contexts directly via the Commit Status API instead.
  codecov-passthrough:
    needs: changes
    if: needs.changes.outputs.provider == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Post passing status for required codecov checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # pull_request events set github.sha to a synthetic merge commit;
          # required status checks are evaluated against the PR's actual
          # head commit, so prefer that when present.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for context in codecov/project/client codecov/patch/client; do
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=success \
              -f context="$context" \
              -f description="No internal/client changes in this diff"
          done
