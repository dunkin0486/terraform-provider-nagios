name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # lint/test are required status checks on main. A trigger-level paths
  # filter would make GitHub wait forever on PRs that never schedule these
  # jobs at all - instead this job always runs (cheap) and lint/test key off
  # its output with a job-level `if:`, which reports "skipped" rather than
  # never reporting - and GitHub treats a skipped required check as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.filter.outputs.provider }}
    steps:
      # dorny/paths-filter only uses the GitHub API (skipping the need for a
      # checkout) for pull_request events - for push (main's post-merge
      # commits, release-please's version-bump commits), it needs actual git
      # history to diff against github.event.before, and fails outright
      # without one ("fatal: not a git repository"). Confirmed this was
      # silently failing changes -> lint/test (via `if: needs.changes...`)
      # skipped, not run - on every push to main. fetch-depth: 0 for full
      # history rather than a fixed shallow depth, since a push can carry
      # more than one new commit (a merge commit, not just a single squash).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            provider:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'examples/**'
              - '.github/workflows/test.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'
          repo-checkout: false

  test:
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go build ./...
      - run: go test -v -coverprofile=coverage.out -covermode=atomic ./internal/...
      - run: terraform fmt -check -recursive examples/
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
