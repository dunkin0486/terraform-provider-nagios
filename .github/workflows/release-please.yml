name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go

      # release-please pushes the tag/release using the default GITHUB_TOKEN,
      # which GitHub deliberately excludes from triggering other workflows
      # (avoids infinite trigger loops) - so release.yml's `on: push: tags`
      # never fires on its own here. Dispatch it explicitly instead, using
      # the workflow_dispatch trigger added alongside it.
      - name: trigger provider release build
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: '${{ steps.release.outputs.tag_name }}',
            })
