name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build
        run: |
          mkdir -p dist
          for os_arch in linux/amd64 darwin/amd64 windows/amd64; do
            os="${os_arch%/*}"
            arch="${os_arch#*/}"
            out="dist/terraform-provider-nagios_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -o "$out" .
          done
          cd dist && gzip *
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
