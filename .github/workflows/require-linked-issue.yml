name: require linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    # release-please's version-bump PR (github-actions[bot]) and Dependabot's
    # dependency-bump PRs (dependabot[bot]) are automated and never have a
    # linked issue to reference - skipping (not passing) is the right call
    # here, and it reports as "skipped" rather than a failure, which
    # required-status-checks treats as passing, the same way test.yml's
    # lint/test jobs skip via `if: needs.changes...`. Both logins are
    # GitHub-controlled bot identities a regular contributor's PR can't spoof.
    if: github.event.pull_request.user.login != 'github-actions[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check for a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences { totalCount }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')

          if [ "$count" -eq 0 ]; then
            echo "::error::No linked issue found. Per CLAUDE.md, every PR needs an issue linked via a closing keyword (e.g. 'Closes #123') in the PR description."
            exit 1
          fi

          echo "Linked issue count: $count"
