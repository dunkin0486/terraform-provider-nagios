services:
  nagiosxi:
    build: .
    # Private GHCR package - `docker compose up` pulls this if it's present
    # and you're logged in (docker login ghcr.io), and falls back to `build`
    # above otherwise. See README.md for one-time setup.
    #
    # Set NAGIOSXI_IMAGE to a local tag (e.g. after running
    # snapshot-local.sh) to boot from a fully-installed local snapshot
    # instead - skips the ~10-50min fullinstall entirely. Only do this once
    # that tag already exists locally: if it doesn't, `up` falls back to
    # building a fresh (pre-install) image under that same tag, per the
    # pull/build fallback described above.
    image: ${NAGIOSXI_IMAGE:-ghcr.io/dunkin0486/terraform-provider-nagios-test-nagiosxi:latest}
    privileged: true
    cgroup: host
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "8080:80"
      - "8443:443"
    healthcheck:
      # fullinstall takes 10-15+ minutes on first boot; start_period gives it
      # room before failed checks count against the container.
      test: ["CMD", "curl", "-fsk", "http://localhost/nagiosxi/login.php"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 20m
