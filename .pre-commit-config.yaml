# Fast local checks only - mirrors the build/vet/lint steps from
# .github/workflows/test.yml, scoped to changed files for quick commits.
# `go build` and the acceptance test suite still run in CI / before a PR
# (see CONTRIBUTING.md); they're deliberately not duplicated here.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
